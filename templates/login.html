{% extends "base.html" %}

{% block title %}Sign In - Crime Record Management System{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="card">
    <div class="auth-header">
      <div class="auth-icon">&#128272;</div>
      <h1>Personnel Authentication</h1>
      <p>Enter your department credentials to access the digital crime record archives.</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" id="form-login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="officer@department.local" 
          value="{{ request.form.get('email', '') }}"
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="required">*</span></label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="Enter account password" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="btn-submit-login">
        Sign In to Portal
      </button>
    </form>

    <div class="auth-footer">
      Don't have an authorized account? 
      <a href="{{ url_for('register') }}" id="link-to-register">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
